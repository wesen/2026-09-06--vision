almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: COSMOS-VERIFY
      preset: micro
    - w: 1fr
      text: V1 START
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Local Visual Verifiers
    preset: h1
    lines: 3
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - V1 pin and smoke both runtimes
    - V2 bounded evidence execution
    - V3 strict answers and citations
    - V4 reviewed matched comparison
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '4'
    - - NEXT
      - V1 candidate load and image smoke
