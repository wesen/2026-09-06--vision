almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: COSMOS-VERIFY
      preset: micro
    - w: 1fr
      text: STATUS
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Reasoning comparison plan
    preset: h1
    lines: 3
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - P1 shared profiles and answer parser
    - P2 pilots and frozen visual cases
    - P3 comparison and RULES report
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '3'
    - - NEXT
      - P1 implement shared runtime
