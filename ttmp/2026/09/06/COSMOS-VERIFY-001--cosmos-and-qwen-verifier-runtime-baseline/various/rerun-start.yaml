almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: COSMOS-VERIFY
      preset: micro
    - w: 1fr
      text: EVAL START
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Rerun Measured Comparisons
    preset: h1
    lines: 3
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - freeze reviewed verifier cases
    - compare 2B and 8B answers
    - rerun native temporal heads
    - report separate gains and failures
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '4'
    - - NEXT
      - frozen inputs and sequential runs
