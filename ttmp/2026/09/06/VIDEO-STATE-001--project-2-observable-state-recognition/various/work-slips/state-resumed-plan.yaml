almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: VIDEO-STATE-1
      preset: micro
    - w: 1fr
      text: RESUMED / P1
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Recognize observable household states
    preset: h1
    lines: 3
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - P1 review source-hashed RGB labels
    - P2 text margins and linear baseline
    - P3 context controls and abstention
    - P4 evidence timeline and report
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '4'
    - - NEXT
      - P1 review pixels and unknown cases
