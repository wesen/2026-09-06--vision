[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-workbench"
version = "0.1.0"
description = "Timestamped local video search with reproducible features"
requires-python = ">=3.11,<3.13"
dependencies = ["mlx-vlm==0.6.17", "av>=14,<18", "numpy>=2,<3", "pillow>=11,<13", "fastapi>=0.115", "uvicorn>=0.34", "psutil>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
video-workbench = "video_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_workbench"]
