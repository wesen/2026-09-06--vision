[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-workbench"
version = "0.1.0"
description = "Timestamped local video search with reproducible features"
requires-python = ">=3.11,<3.13"
dependencies = ["av>=14,<18", "numpy>=2,<3", "pillow>=11,<13", "fastapi>=0.115", "uvicorn>=0.34", "psutil>=6", "jinja2>=3.1"]

[project.optional-dependencies]
pooled-images = ["mlx-vlm==0.6.17"]
native-video = ["mlx-vlm @ git+https://github.com/wesen/mlx-vlm.git@6452614f6de04694d1e34fd13abaca11f6ffb994", "transformers==5.16.1", "torch==2.14.0", "torchvision==0.29.0", "mlx==0.32.2", "mlx-metal==0.32.2", "numpy==2.4.6", "pillow==12.3.0", "av==17.1.0"]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
video-workbench = "video_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_workbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
conflicts = [[{ extra = "pooled-images" }, { extra = "native-video" }]]
